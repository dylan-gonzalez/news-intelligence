name: News Aggregator (30-Minute Schedule)

on:
  schedule:
    # Trigger every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'collector.py'
      - 'index.html'
      - 'sources.json'
      - '.github/workflows/**'

permissions:
  id-token: write
  contents: read

jobs:
  ingest-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::145440262150:role/github-actions-news-intelligence
          aws-region: ap-southeast-2

      - name: Pull current state snapshot from S3
        run: |
          aws s3 cp s3://info.dylangonzalez.dev/db_snapshot.json ./db_snapshot.json || true

      - name: Run News Collector Engine
        run: |
          python collector.py

      - name: Push updated feed & assets directly to S3
        run: |
          aws s3 sync . s3://info.dylangonzalez.dev \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".gitignore" \
            --exclude "*.py" \
            --exclude "*.sql" \
            --exclude "*.db*" \
            --exclude "README.md" \
            --exclude "LEGAL.md" \
            --exclude "deploy.ps1" \
            --exclude "setup_windows_task.ps1" \
            --exclude "__pycache__/*"

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id EW0A0BPO9NQCN \
            --paths "/*"
